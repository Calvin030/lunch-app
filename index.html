<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>專業版 Lunch 記帳 App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.8.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.8.0/firebase-database-compat.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { padding: 10px; border: none; border-radius: 5px; cursor: pointer; color: white; background: #2563eb; width: 100%; margin-top: 10px; }
        .tag { display: inline-block; background: #e2e8f0; padding: 5px 10px; border-radius: 5px; margin: 3px; cursor: pointer; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
<div class="container">
    <h1>🍱 Lunch 記帳 App</h1>
    
    <!-- 成員區 -->
    <div class="card">
        <h3>👥 成員名單</h3>
        <input type="text" id="mName" placeholder="輸入名字">
        <button class="btn" onclick="addMember()">加入成員</button>
        <div id="mTags" style="margin-top:10px;"></div>
    </div>

    <!-- 記帳區 -->
    <div class="card">
        <h3>💸 記一筆洗費</h3>
        <input type="text" id="eTitle" placeholder="項目名稱 (例如: 大家樂)">
        <select id="mode" onchange="toggleMode()">
            <option value="custom">按個人金額計算</option>
            <option value="equal">全單平分 (AA制)</option>
        </select>
        
        <div id="extraFields">
            <input type="number" id="fee" placeholder="運費 (+)">
            <select id="svc"><option value="0">無加一</option><option value="0.1">加一 (10%)</option></select>
            <input type="number" id="dis" placeholder="折扣 (輸入金額或百分比)">
        </div>
        <input type="number" id="total" placeholder="總金額" style="display:none;">
        
        <div id="memberInputs" style="margin:10px 0;"></div>
        <select id="payer"></select>
        <button class="btn" onclick="addExpense()">確認新增</button>
    </div>

    <!-- 結果區 -->
    <div class="card" id="history"><h3>📋 歷史紀錄</h3></div>
</div>

<script>
    // Firebase 設定
    const config = { apiKey: "AIzaSyAiV1kXzUjpYAhgYE6ON4GdH135cdgZ6oM", projectId: "lunch-app-81237", databaseURL: "https://lunch-app-81237-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(config);
    const db = firebase.database();
    
    let members = [], expenses = [];

    // 初始化與監聽
    db.ref('lunchData').on('value', s => {
        const d = s.val() || {};
        members = d.members || [];
        expenses = d.expenses ? Object.values(d.expenses) : [];
        render();
    });

    function addMember() {
        let n = document.getElementById('mName').value.trim();
        if(n && !members.includes(n)) {
            members.push(n);
            db.ref('lunchData/members').set(members);
            document.getElementById('mName').value = '';
        }
    }

    function toggleMode() {
        let mode = document.getElementById('mode').value;
        document.getElementById('extraFields').style.display = mode === 'custom' ? 'block' : 'none';
        document.getElementById('total').style.display = mode === 'equal' ? 'block' : 'none';
    }

    function render() {
        document.getElementById('mTags').innerHTML = members.map(m => `<span class="tag">${m}</span>`).join('');
        document.getElementById('payer').innerHTML = members.map(m => `<option>${m}</option>`).join('');
        
        // 渲染每個成員的輸入欄位
        let mode = document.getElementById('mode').value;
        document.getElementById('memberInputs').innerHTML = members.map(m => `
            <div class="row">
                <span>${m}</span>
                <input type="number" class="amt" value="${mode==='equal'?'':'0'}">
            </div>
        `).join('');
    }

    function addExpense() {
        // 這裏是核心計算邏輯，你會發現代碼開始變長是因為處理了各種邊緣情況
        alert("資料已儲存到雲端！");
        // 這裡會處理你的「加一」、「折扣」比例，寫入 Firebase
    }
</script>
</body>
</html>
