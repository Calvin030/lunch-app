<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch 記帳 App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.8.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.8.0/firebase-database-compat.min.js"></script>
    <style>
        :root { --primary-color: #2563eb; --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #1e293b; --border-color: #e2e8f0; --danger-color: #ef4444; --success-color: #10b981; }
        body { font-family: sans-serif; background-color: var(--bg-color); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 5px; }
        button { background: var(--primary-color); color: white; border: none; font-weight: bold; cursor: pointer; }
        .tag { display: inline-block; background: #e2e8f0; padding: 5px 10px; border-radius: 5px; margin: 3px; }
        .split-row { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; background: #f1f5f9; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🍱 Lunch 記帳 App</h1>

    <!-- 1. 成員管理 -->
    <div class="card">
        <h2>👥 成員管理</h2>
        <input type="text" id="memberNameInput" placeholder="輸入姓名">
        <button onclick="addMember()">新增成員</button>
        <div id="memberTags" style="margin-top: 10px;"></div>
    </div>

    <!-- 2. 記帳區 -->
    <div class="card">
        <h2>💸 記一筆洗費</h2>
        <input type="text" id="expenseTitle" placeholder="項目名稱">
        <select id="splitMode" onchange="initSplitInputs()">
            <option value="custom">按原價分攤</option>
            <option value="equal">全單平分 (AA制)</option>
        </select>
        
        <div id="customControls">
            <input type="number" id="expenseFee" placeholder="運費/平台費 (+)" oninput="autoRecalc()">
            <select id="serviceCharge" onchange="autoRecalc()">
                <option value="0">無加一</option>
                <option value="0.1">有加一 (10%)</option>
            </select>
            <select id="discountType" onchange="autoRecalc()">
                <option value="percent">折扣 (%)</option>
                <option value="fixed">折扣 ($)</option>
            </select>
            <input type="number" id="expenseDiscount" placeholder="折扣數值" oninput="autoRecalc()">
        </div>
        <input type="number" id="equalTotalAmount" placeholder="總消費金額" style="display:none;" oninput="autoRecalc()">

        <select id="expensePayer" style="margin-top:10px;"></select>
        <div id="expenseSplitContainer" style="margin-top:10px;"></div>
        
        <h3 id="finalDisplay" style="color:var(--primary-color);">實付: HK$ 0.00</h3>
        <button onclick="addExpense()">確認新增</button>
    </div>

    <div class="card">
        <h2>📜 歷史與結算</h2>
        <div id="settlementResult"></div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAiV1kXzUjpYAhgYE6ON4GdH135cdgZ6oM", projectId: "lunch-app-81237", databaseURL: "https://lunch-app-81237-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let members = [], expenses = [];

    db.ref('lunchData').on('value', s => {
        const data = s.val() || {};
        members = data.members || [];
        expenses = data.expenses ? Object.keys(data.expenses).map(k => ({ id: k, ...data.expenses[k] })) : [];
        render();
    });

    function addMember() {
        const name = document.getElementById('memberNameInput').value.trim();
        if (name && !members.includes(name)) {
            members.push(name);
            db.ref('lunchData/members').set(members);
            document.getElementById('memberNameInput').value = '';
        }
    }

    function removeMember(name) {
        members = members.filter(m => m !== name);
        db.ref('lunchData/members').set(members);
    }

    function initSplitInputs() {
        const mode = document.getElementById('splitMode').value;
        document.getElementById('customControls').style.display = mode === 'custom' ? 'block' : 'none';
        document.getElementById('equalTotalAmount').style.display = mode === 'equal' ? 'block' : 'none';
        
        const container = document.getElementById('expenseSplitContainer');
        container.innerHTML = members.map(m => `
            <div class="split-row">
                <label><input type="checkbox" class="split-check" value="${m}" checked onchange="autoRecalc()"> ${m}</label>
                ${mode === 'custom' ? '<input type="number" class="split-amount" value="0" oninput="autoRecalc()">' : ''}
            </div>
        `).join('');
        autoRecalc();
    }

    function autoRecalc() {
        const mode = document.getElementById('splitMode').value;
        let total = 0;
        if (mode === 'equal') {
            total = parseFloat(document.getElementById('equalTotalAmount').value) || 0;
        } else {
            let base = 0;
            document.querySelectorAll('.split-amount').forEach(i => base += parseFloat(i.value) || 0);
            let fee = parseFloat(document.getElementById('expenseFee').value) || 0;
            let svc = base * (parseFloat(document.getElementById('serviceCharge').value) || 0);
            let dis = document.getElementById('discountType').value === 'percent' ? base * (parseFloat(document.getElementById('expenseDiscount').value)/100 || 0) : (parseFloat(document.getElementById('expenseDiscount').value) || 0);
            total = base + fee + svc - dis;
        }
        document.getElementById('finalDisplay').innerText = '實付: HK$ ' + Math.max(0, total).toFixed(2);
    }

    function addExpense() {
        const mode = document.getElementById('splitMode').value;
        const payer = document.getElementById('expensePayer').value;
        const title = document.getElementById('expenseTitle').value || '午餐';
        // 簡單邏輯：儲存後自動會觸發 render
        db.ref('lunchData/expenses').push({ title, payer, mode, timestamp: Date.now() });
        alert('已新增！');
    }

    function render() {
        document.getElementById('memberTags').innerHTML = members.map(m => `<span class="tag">${m} <b onclick="removeMember('${m}')" style="cursor:pointer;color:red;">&times;</b></span>`).join('');
        document.getElementById('expensePayer').innerHTML = members.map(m => `<option value="${m}">${m}</option>`).join('');
        initSplitInputs();
    }
</script>
</body>
</html>
